site_name: AIMigrate
site_description: Run your prompts on two LLMs and find out what regressed.
site_url: https://babaliauskas.github.io/AIMigrate/
repo_url: https://github.com/babaliauskas/AIMigrate
repo_name: babaliauskas/AIMigrate

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - Evaluators: evaluators.md
  - Agent migrations (v0.2): agents.md
  - Methodology: methodology.md
  - FAQ: faq.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
