name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # We don't ship a uv.lock (this project installs via
          # `uv pip install -e .[dev]`), so key the cache on pyproject.toml
          # instead of the default `**/uv.lock` which fails the job.
          cache-dependency-glob: 'pyproject.toml'

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv & install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Format check (ruff format)
        run: |
          source .venv/bin/activate
          ruff format --check .

      - name: Type-check (mypy --strict)
        run: |
          source .venv/bin/activate
          mypy --strict src/aimigrate

      - name: Tests (pytest)
        run: |
          source .venv/bin/activate
          pytest
