# AIMigrate v0.2 agent example: a customer-routing agent with 3 tools.
#
# Run with mocked LLMs (CI / no API keys):
#     pytest tests/integration/test_tool_pipeline.py
#
# Or with real Gemini keys:
#     cd examples/agent
#     export GOOGLE_API_KEY=...
#     aimigrate run --yes --from gemini-2.5-flash --to gemini-2.5-pro
#     aimigrate evaluate <run-id>
#     aimigrate analyze <run-id>
#     aimigrate report <run-id> --open
version: 1

prompts:
  - id: customer_routing
    detection: python_string
    path: prompts.py
    variable: AGENT_SYSTEM_PROMPT
    variables: [query]
    # v0.2 — tools_path makes this an agent prompt; the orchestrator
    # uses ModelClient.complete_with_tools and tool evaluators apply.
    tools_path: tools.yaml

defaults:
  source_model: gemini-2.5-flash
  target_model: gemini-2.5-pro
  judge_model: gemini-2.5-pro
  concurrency: 4
  cache: true
  max_cost_usd: 50.0

evaluators:
  # Length is a cheap structural sanity check on the model's text response.
  structural:
    - type: length
      min_chars: 1
      max_chars: 2000

  # v0.2 — tool-call evaluators. tool_selection is the most useful for
  # migrations: it tells you whether the new model still picks the
  # right tools for each example.
  tool_selection:
    - name: routing
      mode: expected
      severity_floor: high

slices:
  - name: security
    filter: security
  - name: routine
    filter: routine
