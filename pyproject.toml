[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evalshift"
version = "0.2.0"
description = "Run your prompts on two LLMs and find out, with statistical confidence, what regressed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "Lukas Babaliauskas" }]
keywords = ["llm", "evaluation", "regression-testing", "anthropic", "openai", "gemini", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "httpx>=0.27",
    "litellm>=1.40",
    "rich>=13.7",
    "jinja2>=3.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "greenlet>=3.0",  # required by SQLAlchemy's async API
    "pyyaml>=6.0",
    "tiktoken>=0.7",
    "jsonschema>=4.22",
    "pygments>=2.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "mkdocs-material>=9.5",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.22",
    "respx>=0.21",
]

[project.urls]
Homepage = "https://github.com/babaliauskas/EvalShift"
Documentation = "https://github.com/babaliauskas/EvalShift#readme"
Repository = "https://github.com/babaliauskas/EvalShift"
Issues = "https://github.com/babaliauskas/EvalShift/issues"
Changelog = "https://github.com/babaliauskas/EvalShift/blob/main/CHANGELOG.md"

[project.scripts]
evalshift = "evalshift.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/evalshift"]

[tool.hatch.build.targets.sdist]
include = [
    "src/evalshift",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=evalshift",
    "--cov-report=term-missing",
]
markers = [
    "integration: integration tests (mocked LLM providers)",
    "slow: tests that take more than a second",
]

[tool.coverage.run]
branch = true
source = ["evalshift"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
